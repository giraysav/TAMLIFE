[alembic]
script_location = alembic
prepend_sys_path = .
# No password in this file. TAMLIFE_DATABASE_URL overrides this default.
sqlalchemy.url = postgresql+psycopg://localhost:5432/tamlife
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
