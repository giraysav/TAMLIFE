[pytest]
# Calistirma (backend klasorunden): ..\.venv\Scripts\python -m pytest
# Gecici SQLite kullanir; canli panel veritabanina, AD'ye ve dis kaynaklara baglanmaz (tests/conftest.py).
testpaths = tests
pythonpath = . tests
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
