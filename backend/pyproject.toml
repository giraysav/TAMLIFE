[project]
name = "tamlife"
version = "3.5.0"
description = "TAMLIFE v3.5 FastAPI modul monoliti"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "import-linter>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"
[[tool.importlinter.contracts]]
name = "Moduller birbirinden bagimsiz (iletisim yalniz app.modules.contracts / sozlesme)"
type = "independence"
modules = [
    "app.modules.baglantili",
    "app.modules.ekip",
    "app.modules.gelir_uretim",
    "app.modules.musteri",
    "app.modules.onedesk",
    "app.modules.proje",
    "app.modules.radar",
    "app.modules.rapor",
    "app.modules.roller",
    "app.modules.sunum",
    "app.modules.takvim",
    "app.modules.talep",
    "app.modules.tamapn",
    "app.modules.tamsms",
    "app.modules.topoloji",
    "app.modules.toptan",
    "app.modules.utilizasyon",
]

[[tool.importlinter.contracts]]
name = "Core data adapters do not import modules"
type = "forbidden"
source_modules = [
    "app.core",
    "app.data",
    "app.adapters",
]
forbidden_modules = [
    "app.modules",
]

